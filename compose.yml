services:
  relay:
    image: sova/relay
    build:
      context: .
      target: relay
    container_name: relay
    restart: unless-stopped
    command:
      - -hostname=${RELAY_HOSTNAME}
      - -udp=:8443
      - -tcp=:8443
      - -tls-cert=/etc/letsencrypt/live/${RELAY_HOSTNAME}/fullchain.pem
      - -tls-key=/etc/letsencrypt/live/${RELAY_HOSTNAME}/privkey.pem
      - -origins=${RELAY_ORIGINS}
      - -target=${RELAY_TARGET}
    ports:
      - 8443:8443/tcp
      - 8443:8443/udp
    volumes:
      - ${RELAY_CERTS}:/etc/letsencrypt:ro
    networks:
      - sova

  relay-site:
    image: sova/relay-site
    build:
      context: .
      target: site
    container_name: relay-site
    restart: unless-stopped
    ports:
      - 127.0.0.1:${RELAY_SITE_PORT}:80

networks:
  sova:
    external: true
