server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip_vary on;
    gzip on;
    gzip_types application/javascript text/javascript application/json text/css;

    location / {
        add_header Cache-Control "no-cache" always;
    }

    location ~ \.mcbesnd$ {
        gzip off;
        gzip_static off;
        add_header Cache-Control "no-cache" always;
    }
}
